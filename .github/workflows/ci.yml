name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; the single job grants what it needs.
permissions: {}

# A newer push supersedes older in-flight runs of the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # persist-credentials: false: no step here pushes, so the checkout
      # token must not land in the workspace git config.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.18.0

      # A CI cache is fine here; publish.yml stays cache-free on purpose so a
      # poisoned cache entry cannot reach npm publish.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # A packaging regression (files list, exports) fails the build here,
      # not at publish time.
      - name: Pack dry run
        run: npm pack --dry-run
