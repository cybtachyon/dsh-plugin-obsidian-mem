packages:
  - 'packages/*'
autoInstallPeers: true
allowBuilds:
  esbuild: true
  # onnxruntime-node's postinstall installs the native inference binaries the
  # @huggingface/transformers embedder loads; protobufjs's generates the
  # parser fallback @zilliz/milvus2-sdk-node uses.
  onnxruntime-node: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5-alpha.2 || 4.0.6-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.6-alpha.2 || 1.8.7-alpha.2'
trustLockfile: true
