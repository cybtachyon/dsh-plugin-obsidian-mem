# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # The prepared-prompt carriers (PLAN-git-versioning source-of-truth
    # constants): trailing spaces inside the shipped prompt literals are
    # load-bearing bytes, so the fixer must pass over them; the regex names
    # the six carrier files, never whole packages.
    { id = "trailing-whitespace", exclude = "^packages/(service/(src|lib)/dream\\.(ts|js)|tools/(src|lib)/(prompt|audit)\\.(ts|js))$" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "check-commit-msg-attribution", name = "commit-msg external assistant attribution check", entry = "scripts/check_commit_msg_attribution.py", language = "script", stages = ["commit-msg"] },
    { id = "jactionlint", name = "jactionlint (GitHub Actions workflows)", entry = "jactionlint", language = "system", files = "^\\.github/workflows/.*\\.ya?ml$", pass_filenames = false },
]
